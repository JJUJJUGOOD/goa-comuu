name: Community CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: community-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node 24 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check JavaScript syntax
        run: npm run check
      - name: Run API, persistence and authorization tests
        run: npm test

  package:
    name: Package tested source
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out tested source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Create deployment archive without user data
        run: tar -czf goa-community.tar.gz package.json server.mjs db.mjs network.mjs security.mjs public
      - name: Save deployment archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: goa-community-${{ github.sha }}
          path: goa-community.tar.gz
          retention-days: 14
          if-no-files-found: error
